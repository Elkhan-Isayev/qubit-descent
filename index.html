<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qubit Descent: a journey into a quantum computer</title>
    <meta name="description" content="A continuous WebGL zoom into a superconducting quantum computer, from the dilution refrigerator to a Josephson junction and a single phosphorus atom, showing how each part is made. Every number is sourced." />
    <meta property="og:title" content="Qubit Descent: a journey into a quantum computer" />
    <meta property="og:description" content="Nine orders of magnitude, from the cryostat to one atom." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elkhan-isayev.github.io/qubit-descent/" />
    <meta property="og:image" content="https://elkhan-isayev.github.io/qubit-descent/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#02040a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%2307101f'/%3E%3Cpath d='M32 14v36M14 32h36' stroke='%237fd3ff' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffb46b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <!-- language switcher -->
    <nav id="lang" class="lang" data-i18n-title="language"></nav>

    <!-- loading -->
    <div id="loader">
      <div class="loader-inner">
        <div class="loader-mark"></div>
        <h1 data-i18n="title">Qubit Descent</h1>
        <p class="loader-sub" data-i18n="loaderSub">Cooling down to 6 millikelvin…</p>
      </div>
    </div>

    <!-- HUD: scale -->
    <header id="hud" class="hidden">
      <div class="brand"><span class="brand-title" data-i18n="title">Qubit Descent</span> <span data-i18n="subtitle">from the cryostat to a single atom</span></div>
      <div class="scale">
        <span id="scale-value">2.00</span>
        <span id="scale-unit" class="unit tip" tabindex="0">m</span>
      </div>
      <div class="scale-caption" data-i18n="fieldOfView">field of view</div>
    </header>

    <!-- level card -->
    <aside id="card" class="hidden">
      <div class="card-level" id="card-level"></div>
      <h2 id="card-title"></h2>
      <p id="card-text"></p>
      <div id="card-fab">
        <div class="card-k" data-i18n="howMade">How it is made</div>
        <p id="card-fab-text"></p>
        <button id="fab-play" class="fab-btn hidden"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span></span></button>
      </div>
      <div id="card-facts-title" class="card-k facts-title"></div>
      <dl id="card-facts"></dl>
      <div class="card-sources"><span class="card-k" data-i18n="sources">Sources</span><span id="card-sources"></span></div>
    </aside>

    <!-- scale ruler -->
    <div id="ruler" class="hidden">
      <div id="ruler-track"></div>
      <div id="ruler-head"></div>
    </div>

    <!-- fabrication caption -->
    <div id="fab-caption" class="hidden">
      <div class="fab-head"><span class="fab-step" id="fab-step"></span><button id="fab-stop" class="text-btn" data-i18n="fabStop">Stop</button></div>
      <p id="fab-text"></p>
      <div class="fab-bar"><i id="fab-bar"></i></div>
    </div>

    <!-- navigation -->
    <footer id="nav" class="hidden">
      <button id="btn-prev" class="icon-btn" data-i18n-title="prev">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <span class="hint" data-i18n="hint">Scroll to descend</span>
      <button id="btn-next" class="icon-btn" data-i18n-title="next">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button id="btn-credits" class="text-btn" data-i18n="credits">Data sources</button>
    </footer>

    <!-- credits -->
    <div id="credits" class="hidden" role="dialog" aria-modal="true">
      <div class="credits-panel">
        <button id="credits-close" class="icon-btn" data-i18n-title="close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <h2 data-i18n="credits">Data sources</h2>
        <p data-i18n="creditsIntro"></p>
        <ul id="credits-list"></ul>
        <p class="credits-tools">three.js (MIT) · Qiskit Metal (Apache-2.0) · gdstk (Boost) · shapely (BSD) · Manrope, JetBrains Mono (OFL) · <a href="https://github.com/Elkhan-Isayev/qubit-descent" target="_blank" rel="noopener">GitHub</a></p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
